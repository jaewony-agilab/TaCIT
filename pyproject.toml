[project]
name = "tactile-train"
version = "0.1.0"
description = "Format-invariant tactile policy training (see ai_docs/)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
log = ["wandb>=0.16"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["data", "models", "train"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
